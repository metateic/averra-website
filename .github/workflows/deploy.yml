name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: app

      # @metateic/ui is installed as file:../metateic-ui, so it must be checked out beside the app.
      # Pinned to a tag so a merge to metateic-ui can't break this site's deploy; bump to upgrade.
      # GITHUB_TOKEN can't read other private repos; METATEIC_UI_TOKEN is a fine-grained PAT with read access.
      - uses: actions/checkout@v7
        with:
          repository: metateic/metateic-ui
          ref: v0.2.0
          path: metateic-ui
          token: ${{ secrets.METATEIC_UI_TOKEN || github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            metateic-ui/package-lock.json

      # metateic-ui source is type-checked by next build, which resolves react types from its own node_modules
      - name: Install metateic-ui dependencies
        working-directory: metateic-ui
        run: npm ci

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          # Where the demo request form posts. Set as a repository variable.
          NEXT_PUBLIC_DEMO_FORM_ENDPOINT: ${{ vars.DEMO_FORM_ENDPOINT }}
          # Optional cookieless analytics; nothing loads unless ANALYTICS_SRC is set.
          NEXT_PUBLIC_ANALYTICS_SRC: ${{ vars.ANALYTICS_SRC }}
          NEXT_PUBLIC_ANALYTICS_DOMAIN: ${{ vars.ANALYTICS_DOMAIN }}
          NEXT_PUBLIC_ANALYTICS_WEBSITE_ID: ${{ vars.ANALYTICS_WEBSITE_ID }}

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: app/out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
